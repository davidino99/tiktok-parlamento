name: Video del giorno

# Ogni mattina genera il video dell'episodio con la data di oggi (episodi/AAAA-MM-GG-*.json)
# e lo pubblica come "release": dal telefono basta aprire la pagina Releases e scaricare l'mp4.
# Un video già pubblicato non viene rigenerato (per non consumare due volte i crediti della voce),
# a meno di indicarlo esplicitamente nel campo "episodio".
on:
  schedule:
    - cron: "17 5 * * *" # 06:17 in Italia d'inverno, 07:17 d'estate
  workflow_dispatch:
    inputs:
      tutti:
        description: "Genera subito tutti gli episodi da oggi in poi (salta quelli già pubblicati)"
        type: boolean
        default: false
      episodio:
        description: "Oppure un solo file da rigenerare (es. episodi/2026-11-20-quiz-tre-indovinelli.json)"
        required: false

permissions:
  contents: write

concurrency:
  group: video-del-giorno
  cancel-in-progress: false

jobs:
  elenco:
    runs-on: ubuntu-latest
    outputs:
      episodi: ${{ steps.lista.outputs.episodi }}
    steps:
      - uses: actions/checkout@v5

      - name: Elimina le release di episodi che non esistono più
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          oggi=$(TZ=Europe/Rome date +%F)
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            # solo release di episodi (AAAA-MM-GG-...) da oggi in poi: quelle passate restano come archivio
            [[ "$tag" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}- ]] || continue
            [[ "${tag:0:10}" < "$oggi" ]] && continue
            if [ ! -f "episodi/$tag.json" ]; then
              echo "Elimino $tag (episodio rimosso o spostato)"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done

      - name: Episodi da generare
        id: lista
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODIO: ${{ github.event.inputs.episodio }}
          TUTTI: ${{ github.event.inputs.tutti }}
        run: |
          if [ -n "$EPISODIO" ]; then
            test -f "$EPISODIO" || { echo "::error::File non trovato: $EPISODIO"; exit 1; }
            echo "episodi=$(jq -cn --arg e "$EPISODIO" '[$e]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TUTTI" = "true" ]; then candidati=$(node src/elenca.mjs --tutti); else candidati=$(node src/elenca.mjs); fi
          # Salta i video già pubblicati.
          da_fare=$(for f in $(echo "$candidati" | jq -r '.[]'); do
            nome=$(basename "$f" .json)
            if gh release view "$nome" >/dev/null 2>&1; then echo "Già pubblicato: $nome" >&2; else echo "$f"; fi
          done | jq -R . | jq -cs .)
          echo "Da generare: $da_fare"
          echo "episodi=$da_fare" >> "$GITHUB_OUTPUT"

  genera:
    needs: elenco
    if: needs.elenco.outputs.episodi != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episodio: ${{ fromJson(needs.elenco.outputs.episodi) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Programmi necessari (ffmpeg, emoji)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji espeak-ng

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-voce.txt

      - name: Voce gratuita (Kokoro, Piper)
        if: ${{ (vars.VOCE_MOTORE || 'kokoro') != 'elevenlabs' }}
        run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-voce.txt

      - name: Dipendenze e browser per disegnare i fotogrammi
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Recupera le voci già generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache-voci
          gh release download memoria-voce --dir cache-voci --clobber 2>/dev/null || echo "Nessuna voce salvata finora"
          ls cache-voci | sort > voci-prima.txt
          echo "Voci in memoria: $(wc -l < voci-prima.txt)"

      - name: Genera il video
        env:
          # Motore della voce: kokoro (gratis, predefinito), piper (gratis) o elevenlabs (a crediti).
          VOCE_MOTORE: ${{ vars.VOCE_MOTORE || 'kokoro' }}
          VOCE: ${{ vars.VOCE }}
          VOCE_VELOCITA: ${{ vars.VOCE_VELOCITA }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          EPISODIO: ${{ matrix.episodio }}
        run: node src/genera.mjs "$EPISODIO"

      - name: Salva le voci nuove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls cache-voci | sort > voci-dopo.txt
          nuove=$(comm -13 voci-prima.txt voci-dopo.txt)
          [ -z "$nuove" ] && { echo "Nessuna voce nuova"; exit 0; }
          gh release view memoria-voce >/dev/null 2>&1 || gh release create memoria-voce --prerelease \
            --title "Memoria della voce (non eliminare)" \
            --notes "Audio già generati da ElevenLabs, riusati per non consumare di nuovo i crediti." || true
          cd cache-voci && echo "$nuove" | xargs gh release upload memoria-voce --clobber

      - name: Pubblica come release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for video in uscita/*.mp4; do
            nome=$(basename "$video" .mp4)
            descrizione="uscita/$nome.txt"
            gh release delete "$nome" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$nome" "$video" "$descrizione" \
              --title "$nome" --notes-file "$descrizione" --target "$GITHUB_SHA"
          done
